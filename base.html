<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}LinkChat{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Link<span>Chat</span></a>{% if current_user %}<nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('profile') }}">Profile</a><form method="post" action="{{ url_for('logout') }}"><button>Logout</button></form></nav>{% endif %}</header>{% with msgs=get_flashed_messages(with_categories=true) %}<div class="flashes">{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}</div>{% endwith %}<main>{% block content %}{% endblock %}</main></body></html>
