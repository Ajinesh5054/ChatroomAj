{% extends "base.html" %}{% block title %}{{room.name}}{% endblock %}{% block content %}<section class="room"><aside class="card side"><a href="{{url_for('dashboard')}}">← Dashboard</a><h2>{{room.name}}</h2><p>{{room.description}}</p><p>Host: <b>{{room.host.username}}</b></p><div class="share"><input id="roomLink" value="{{url_for('join_by_link',room_code=room.room_code,_external=True)}}" readonly><button onclick="copyRoom()">Copy</button></div><h3>Members</h3><div>{% for m in members %}<div>🟢 {{m.user.username}}</div>{% endfor %}</div></aside><section class="chat card"><div class="chathead"><b>💬 {{room.name}}</b><button onclick="copyRoom()">🔗 Copy URL</button></div><div id="messages" class="messages"></div><div id="typing"></div><form id="form"><input id="input" maxlength="2000" placeholder="Type a message... 😊" autocomplete="off" required><button type="button" onclick="emoji()">😊</button><button class="primary">Send</button></form></section></section><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>const CODE={{room.room_code|tojson}},ME={{current_user.username|tojson}},s=io(),box=document.getElementById('messages'),inp=document.getElementById('input');function add(m,sys=false){let d=document.createElement('div');if(sys){d.className='system';d.textContent=m.message}else{d.className='msg '+(m.username===ME?'mine':'');let b=document.createElement('div');b.className='bubble';let meta=document.createElement('small');meta.textContent=m.username+' · '+new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});let c=document.createElement('div');c.textContent=m.content;b.append(meta,c);d.append(b)}box.append(d);box.scrollTop=box.scrollHeight}fetch('/api/room/'+CODE+'/messages').then(r=>r.json()).then(x=>(x.messages||[]).forEach(add));s.on('connect',()=>s.emit('join_room',{room_code:CODE}));s.on('new_message',add);s.on('presence',m=>add(m,true));s.on('typing',m=>{document.getElementById('typing').textContent=m.username+' is typing...';setTimeout(()=>document.getElementById('typing').textContent='',1000)});document.getElementById('form').onsubmit=e=>{e.preventDefault();let c=inp.value.trim();if(c)s.emit('send_message',{room_code:CODE,content:c});inp.value=''};inp.oninput=()=>s.emit('typing',{room_code:CODE});function emoji(){inp.value+=' 😊';inp.focus()}async function copyRoom(){let x=document.getElementById('roomLink');try{await navigator.clipboard.writeText(x.value)}catch(e){x.select();document.execCommand('copy')}alert('Room URL copied!')}window.onbeforeunload=()=>s.emit('leave_room',{room_code:CODE});</script>{% endblock %}
