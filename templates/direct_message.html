{% extends "base.html" %}{% block title %}Message{% endblock %}{% block content %}<section class="card chat dm"><div class="chathead"><b>💬 {{other.username}}</b><a class="btn" href="{{url_for('dashboard')}}">Dashboard</a></div><div class="messages">{% for m in messages %}<div class="msg {% if m.sender_id==current_user.id %}mine{% endif %}"><div class="bubble"><small>{{m.sender.username}} · {{m.created_at.strftime('%H:%M')}}</small><div>{{m.content}}</div></div></div>{% else %}<p>No messages yet.</p>{% endfor %}</div><form method="post" class="compose"><input name="content" required maxlength="2000" placeholder="Private message..."><button class="primary">Send</button></form></section>{% endblock %}
