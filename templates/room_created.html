{% extends "base.html" %}{% block title %}Room Created{% endblock %}{% block content %}<section class="card auth wide"><h1>🎉 Chatroom Created!</h1><p>Share this unique link. Everyone who opens it and logs in can use this room.</p><div class="share"><input id="link" value="{{share_url}}" readonly><button class="primary" onclick="copyLink()">Copy Link</button></div><p id="copied"></p><a class="primary btn" href="{{url_for('room',room_code=room.room_code)}}">Open Chatroom</a> <a class="btn" href="{{url_for('dashboard')}}">Dashboard</a></section><script>async function copyLink(){let x=document.getElementById('link');try{await navigator.clipboard.writeText(x.value)}catch(e){x.select();document.execCommand('copy')}document.getElementById('copied').textContent='Link copied!'}</script>{% endblock %}
